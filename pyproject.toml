[project]
name = "rag-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arxiv>=4.0.1",
    "faiss-cpu>=1.15.1",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "pymupdf>=2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag-eval = "rag_eval:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
